name: neom_camera
description: Camera functionality for Open Neom
version: 1.3.0
homepage: https://github.com/Cyberneom/neom_camera
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  neom_core:
    git:
      url: git@github.com:Open-Neom/neom_core.git
  neom_commons:
    git:
      url: git@github.com:Open-Neom/neom_commons.git
  sint: ^2.3.0

  camera: ^0.12.2

  image: ^4.13.1


  path_provider: ^2.1.6


  vector_math: ^2.4.4



  # For horizontal flip of front camera videos
  easy_video_editor: ^0.1.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
